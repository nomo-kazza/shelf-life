<header class="site-header">
  <h1>{{ appName }}</h1>
  <p>{{ tagline }}</p>

  <p>Today's goal: {{ goal.dailyPages() }} pages</p>

  <nav aria-label="Main">
    <ul>
      @for (link of links; track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">
            {{ link.label }}
          </a>
        </li>
      } @empty {
        <li>No navigation links.</li>
      }
    </ul>
  </nav>
</header>
