<section class="goal" aria-labelledby="goal-heading">
  <h2 id="goal-heading">Reading goal</h2>
  <p aria-live="polite">
    {{ goal.dailyPages() }} pages a day · {{ goal.weeklyPages() }} a week ({{ intensity() }})
  </p>
  <button type="button" (click)="goal.decrease()" [disabled]="goal.dailyPages() <= 5">−5</button>
  <button type="button" (click)="goal.increase()">+5</button>
</section>
