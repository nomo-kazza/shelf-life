<section class="goal" aria-labelledby="goal-heading">
  <h2 id="goal-heading">Reading goal</h2>

  <p aria-live="polite">
    {{ dailyPages() }} pages a day · {{ weeklyPages() }} a week ({{ intensity() }})
  </p>

  <button type="button" (click)="decrease()" [disabled]="dailyPages() <= 5">−5</button>
  <button type="button" (click)="increase()">+5</button>
</section>
