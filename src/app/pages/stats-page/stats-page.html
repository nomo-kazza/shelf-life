<!-- stats-page.html -->
<h2 #pageHeading tabindex="-1">Reading stats</h2>
<app-shelf-stats />
<app-goal-form />

<h3>Finished books</h3>
<ul>
  @for (book of shelf.finishedBooks(); track book.id) {
    <li>{{ book.title }} ({{ book.pages }} pages)</li>
  } @empty {
    <li>Nothing finished yet.</li>
  }
</ul>

<button (click)="resetToSampleBooks()">Reset to sample books</button>
