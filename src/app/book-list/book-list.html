<section>
    <p aria-live="polite">{{ finishedCount() }} of {{ books().length }} finished | {{ pagesReadCount() }} pages read | {{ progress() }}%</p>

    <button type="button" (click)="toggleFilter()" 
    [attr.aria-pressed]="showUnfinishedOnly()">
        Unfinished only
    </button>
</section>

@for (book of visibleBooks(); track book.id) {
    <app-book-card [book]="book" (toggled)="toggleFinished($event)" />
} @empty {
    @if (books().length === 0) {
        <p>No books in the list</p>
    } @else {
        <p>All caught up. Every book is finished.</p>
    }
}
